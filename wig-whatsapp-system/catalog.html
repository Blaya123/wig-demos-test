<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog - WhatsApp Sales System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            color: #101828;
        }
        header {
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            color: #ffffff;
            padding: 2rem 1rem 1.5rem;
        }
        nav {
            max-width: 1200px;
            margin: 0 auto 1.5rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        nav a {
            color: #ffffff;
            text-decoration: none;
            padding: 0.5rem 0.875rem;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            font-size: 0.875rem;
        }
        nav a:hover { background: rgba(255,255,255,0.2); }
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
        }
        header h1 {
            font-size: 1.875rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        header p { color: #e5e7eb; }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        .product-card {
            border: 1px solid #e4e7ec;
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.2s;
            background: #ffffff;
        }
        .product-card:hover {
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            border-color: #d0d5dd;
        }
        .product-image {
            width: 100%;
            height: 250px;
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            overflow: hidden;
        }
        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-info {
            padding: 1.25rem;
        }
        .product-name {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #101828;
        }
        .product-price {
            font-size: 1.25rem;
            font-weight: 700;
            color: #000000;
            margin-bottom: 0.75rem;
        }
        .product-details {
            display: flex;
            flex-direction: column;
            gap: 0.375rem;
            margin-bottom: 0.75rem;
            font-size: 0.875rem;
            color: #475467;
        }
        .product-details span {
            display: flex;
            justify-content: space-between;
        }
        .product-details strong {
            color: #101828;
            font-weight: 500;
        }
        .product-status {
            display: inline-block;
            padding: 0.25rem 0.625rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 500;
            margin-bottom: 0.75rem;
        }
        .in-stock {
            background: #dcfce7;
            color: #166534;
        }
        .low-stock {
            background: #fef3c7;
            color: #92400e;
        }
        .out-of-stock {
            background: #fee2e2;
            color: #991b1b;
        }
        .product-desc {
            font-size: 0.875rem;
            color: #475467;
            margin-bottom: 1rem;
            line-height: 1.5;
        }
        .ask-btn {
            display: block;
            width: 100%;
            text-align: center;
            background: #000000;
            color: #ffffff;
            text-decoration: none;
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.875rem;
        }
        .ask-btn:hover { background: #1a1a1a; }
        footer {
            text-align: center;
            padding: 2rem 1rem;
            background: #f9fafb;
            color: #6b7280;
            font-size: 0.875rem;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">← Back to Introduction</a>
            <a href="whatsapp-demo.html">Try WhatsApp Demo</a>
            <a href="dashboard.html">Owner Dashboard</a>
            <a href="../index.html">All Demos</a>
        </nav>
        <div class="header-content">
            <h1>Product Catalog</h1>
            <p>Realistic women's wig collection with full details</p>
        </div>
    </header>

    <div class="container">
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <footer>
        <p>Product Catalog - WhatsApp Sales System Demo</p>
    </footer>

    <script>
        const products = [
            {
                id: 1,
                name: "Bone Straight Wig",
                price: 85000,
                image: "https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=600&h=600&fit=crop",
                lengths: ["16\"", "18\"", "20\"", "24\"", "26\""],
                texture: "Bone Straight",
                laceType: "13x4 Lace Front",
                colors: ["Natural Black", "Dark Brown", "#1B"],
                stock: 15,
                status: "in-stock",
                description: "Sleek, silky bone straight wig with natural movement. Perfect for a polished, elegant look."
            },
            {
                id: 2,
                name: "Body Wave Wig",
                price: 95000,
                image: "https://images.unsplash.com/photo-1580618672591-eb180b1a973f?w=600&h=600&fit=crop",
                lengths: ["18\"", "20\"", "22\"", "24\""],
                texture: "Body Wave",
                laceType: "13x6 Lace Front",
                colors: ["Natural Black", "Off Black", "Dark Brown"],
                stock: 8,
                status: "in-stock",
                description: "Soft, bouncy body wave with gorgeous volume. Great for both casual and dressy occasions."
            },
            {
                id: 3,
                name: "Deep Curly Wig",
                price: 110000,
                image: "https://images.unsplash.com/photo-1492106087820-71f1a00d2b11?w=600&h=600&fit=crop",
                lengths: ["16\"", "18\"", "20\""],
                texture: "Deep Curly",
                laceType: "13x4 Lace Front",
                colors: ["Natural Black", "Burgundy"],
                stock: 3,
                status: "low-stock",
                description: "Tight, defined curls with amazing bounce. Full of volume and very head-turning."
            },
            {
                id: 4,
                name: "Classic Bob Wig",
                price: 65000,
                image: "https://images.unsplash.com/photo-1560869713-7d0a29430803?w=600&h=600&fit=crop",
                lengths: ["10\"", "12\"", "14\""],
                texture: "Straight",
                laceType: "13x4 Lace Front",
                colors: ["Natural Black", "Dark Brown", "Chocolate Brown"],
                stock: 12,
                status: "in-stock",
                description: "Chic, sophisticated bob cut. Low maintenance and perfect for a modern, elegant look."
            },
            {
                id: 5,
                name: "Honey Blonde Wig",
                price: 125000,
                image: "https://images.unsplash.com/photo-1595476108010-b4d1f102b1b1?w=600&h=600&fit=crop",
                lengths: ["18\"", "20\"", "22\"", "24\""],
                texture: "Body Wave",
                laceType: "360 Lace Frontal",
                colors: ["Honey Blonde", "Caramel Blonde", "Strawberry Blonde"],
                stock: 0,
                status: "out-of-stock",
                description: "Beautiful honey blonde shade with body wave texture. Bold, trendy, and eye-catching."
            },
            {
                id: 6,
                name: "Loose Wave Wig",
                price: 98000,
                image: "https://images.unsplash.com/photo-1519699047748-de8e457a634e?w=600&h=600&fit=crop",
                lengths: ["20\"", "22\"", "24\"", "26\""],
                texture: "Loose Wave",
                laceType: "13x6 Lace Front",
                colors: ["Natural Black", "Dark Brown"],
                stock: 10,
                status: "in-stock",
                description: "Relaxed, beachy loose waves. Effortlessly beautiful with a natural, flowing look."
            }
        ];

        function formatPrice(price) {
            return "₦" + price.toLocaleString();
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = products.map(product => `
                <div class="product-card">
                    <div class="product-image">
                        <img src="${product.image}" alt="${product.name}" onerror="this.style.display='none'; this.parentElement.innerHTML='💇‍♀️'">
                    </div>
                    <div class="product-info">
                        <h3 class="product-name">${product.name}</h3>
                        <div class="product-price">${formatPrice(product.price)}</div>
                        <span class="product-status ${product.status}">
                            ${product.status === 'in-stock' ? '✓ In Stock' : product.status === 'low-stock' ? '⚠ Low Stock' : '✗ Out of Stock'}
                        </span>
                        <div class="product-details">
                            <span><strong>Lengths:</strong> ${product.lengths.join(', ')}</span>
                            <span><strong>Texture:</strong> ${product.texture}</span>
                            <span><strong>Lace:</strong> ${product.laceType}</span>
                            <span><strong>Colors:</strong> ${product.colors.join(', ')}</span>
                            <span><strong>Available:</strong> ${product.stock} in stock</span>
                        </div>
                        <p class="product-desc">${product.description}</p>
                        <a href="whatsapp-demo.html?product=${product.id}" class="ask-btn">Ask About This Wig</a>
                    </div>
                </div>
            `).join('');
        }

        renderProducts();
    </script>
</body>
</html>
