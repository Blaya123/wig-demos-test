<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - LaBelle Wigs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            color: #000000;
        }
        header {
            border-bottom: 1px solid #e5e7eb;
            background: #ffffff;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .demo-banner {
            background: #fff3cd;
            padding: 0.5rem 1rem;
            text-align: center;
            font-size: 0.8125rem;
            color: #856404;
            border-bottom: 1px solid #ffc107;
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.75rem;
            font-weight: 700;
            color: #000000;
            text-decoration: none;
        }
        .nav-links {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #000000;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9375rem;
        }
        .nav-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .nav-actions a {
            color: #000000;
            text-decoration: none;
            font-size: 0.9375rem;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        .page-header {
            margin-bottom: 2rem;
        }
        .page-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .cart-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }
        .cart-items {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }
        .cart-item {
            display: grid;
            grid-template-columns: 100px 1fr auto;
            gap: 1rem;
            padding: 1rem;
            border-bottom: 1px solid #f3f4f6;
            align-items: center;
        }
        .cart-item:last-child {
            border-bottom: none;
        }
        .cart-item-image {
            width: 100px;
            height: 100px;
            background: #f9fafb;
            border-radius: 8px;
            overflow: hidden;
        }
        .cart-item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .cart-item-details h3 {
            font-size: 0.9375rem;
            font-weight: 600;
            margin-bottom: 0.375rem;
        }
        .cart-item-details p {
            font-size: 0.8125rem;
            color: #6b7280;
            margin-bottom: 0.25rem;
        }
        .cart-item-price {
            font-weight: 600;
            font-size: 1rem;
        }
        .cart-item-actions {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            align-items: flex-end;
        }
        .remove-btn {
            background: none;
            border: none;
            color: #dc2626;
            cursor: pointer;
            font-size: 0.8125rem;
            font-family: inherit;
        }
        .remove-btn:hover {
            text-decoration: underline;
        }
        .cart-summary {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 1.25rem;
            height: fit-content;
        }
        .cart-summary h2 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.75rem;
            font-size: 0.9375rem;
            color: #4b5563;
        }
        .summary-row.total {
            font-weight: 600;
            font-size: 1.125rem;
            color: #000000;
            padding-top: 0.75rem;
            border-top: 1px solid #e5e7eb;
            margin-top: 0.75rem;
        }
        .checkout-btn {
            width: 100%;
            padding: 0.875rem;
            background: #000000;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            margin-top: 1rem;
        }
        .checkout-btn:hover {
            background: #1a1a1a;
        }
        .continue-shopping {
            display: block;
            text-align: center;
            margin-top: 0.75rem;
            color: #000000;
            text-decoration: none;
            font-size: 0.875rem;
        }
        .continue-shopping:hover {
            text-decoration: underline;
        }
        .empty-cart {
            text-align: center;
            padding: 3rem;
            color: #6b7280;
        }
        .empty-cart h2 {
            color: #000000;
            margin-bottom: 0.5rem;
        }
        .shop-btn {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.75rem 1.5rem;
            background: #000000;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
        }
        footer {
            background: #000000;
            color: #9ca3af;
            padding: 2rem 1rem;
            text-align: center;
            font-size: 0.875rem;
            margin-top: 3rem;
        }
        .footer-links {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .footer-links a {
            color: #d1d5db;
            text-decoration: none;
        }
        @media (max-width: 968px) {
            .cart-layout {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 640px) {
            .nav-links { display: none; }
            .cart-item {
                grid-template-columns: 80px 1fr;
            }
            .cart-item-actions {
                grid-column: 1 / -1;
                flex-direction: row;
                justify-content: space-between;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="demo-banner">
        <strong>DEMO:</strong> Website-Only Wig Store
    </div>
    
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">LaBelle Wigs</a>
            <nav class="nav-links">
                <a href="catalog.html">Shop All</a>
                <a href="catalog.html?filter=straight">Straight</a>
                <a href="catalog.html?filter=wave">Wavy</a>
                <a href="catalog.html?filter=curly">Curly</a>
                <a href="catalog.html?filter=bob">Bob</a>
            </nav>
            <div class="nav-actions">
                <a href="assistant.html">💬 Ask Assistant</a>
                <a href="cart.html">🛒 Cart (<span id="cartCount">0</span>)</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="../index.html">All Demos</a>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <h1>Shopping Cart</h1>
        </div>

        <div id="cartContent"></div>
    </div>

    <footer>
        <div class="footer-links">
            <a href="index.html">Home</a>
            <a href="catalog.html">Shop</a>
            <a href="assistant.html">Assistant</a>
            <a href="cart.html">Cart</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="../index.html">All Demos</a>
        </div>
        <p>&copy; 2024 LaBelle Wigs. Premium Women's Wig Store Demo.</p>
    </footer>

    <script>
        function formatPrice(price) {
            return "₦" + price.toLocaleString();
        }

        function loadCart() {
            const cart = JSON.parse(localStorage.getItem('labelle_cart') || '[]');
            const cartContent = document.getElementById('cartContent');
            updateCartCount();
            
            if (cart.length === 0) {
                cartContent.innerHTML = `
                    <div class="empty-cart">
                        <h2>Your cart is empty</h2>
                        <p>Add some beautiful wigs to get started</p>
                        <a href="catalog.html" class="shop-btn">Continue Shopping</a>
                    </div>
                `;
                return;
            }
            
            let subtotal = 0;
            cart.forEach(item => {
                subtotal += item.price * item.quantity;
            });
            
            cartContent.innerHTML = `
                <div class="cart-layout">
                    <div class="cart-items">
                        ${cart.map((item, index) => `
                            <div class="cart-item">
                                <div class="cart-item-image">
                                    <img src="${item.image}" alt="${item.name}">
                                </div>
                                <div class="cart-item-details">
                                    <h3>${item.name}</h3>
                                    <p>Length: ${item.length}" • Color: ${item.color}</p>
                                    <p>Quantity: ${item.quantity}</p>
                                </div>
                                <div class="cart-item-actions">
                                    <div class="cart-item-price">${formatPrice(item.price * item.quantity)}</div>
                                    <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="cart-summary">
                        <h2>Order Summary</h2>
                        <div class="summary-row">
                            <span>Subtotal</span>
                            <span>${formatPrice(subtotal)}</span>
                        </div>
                        <div class="summary-row">
                            <span>Shipping</span>
                            <span>To be calculated</span>
                        </div>
                        <div class="summary-row total">
                            <span>Total</span>
                            <span>${formatPrice(subtotal)}</span>
                        </div>
                        <button class="checkout-btn" onclick="goToCheckout()">Proceed to Checkout</button>
                        <a href="catalog.html" class="continue-shopping">← Continue Shopping</a>
                    </div>
                </div>
            `;
        }

        function removeItem(index) {
            const cart = JSON.parse(localStorage.getItem('labelle_cart') || '[]');
            cart.splice(index, 1);
            localStorage.setItem('labelle_cart', JSON.stringify(cart));
            loadCart();
        }

        function goToCheckout() {
            window.location.href = 'checkout.html';
        }

        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('labelle_cart') || '[]');
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartCount').textContent = count;
        }

        loadCart();
    </script>
</body>
</html>
